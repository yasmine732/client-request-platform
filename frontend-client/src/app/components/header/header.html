<header
  class="sticky top-0 z-50 border-b border-slate-200 bg-white/95 shadow-sm backdrop-blur-xl"
>
  <nav
    class="mx-auto flex min-h-[78px] max-w-7xl items-center justify-between gap-6 px-5 lg:px-8"
  >
    <!-- Logo ClientFlow -->
    <a
      routerLink="/"
      (click)="closeMenu()"
      class="clientflow-logo-link"
      aria-label="Retour à l'accueil ClientFlow"
    >
      <img
        src="clientflow-logo.png"
        alt="Logo ClientFlow"
        class="clientflow-logo"
      />
    </a>

    <!-- Navigation ordinateur -->
    <ul class="hidden items-center gap-8 lg:flex">
      @for (link of navLinks; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="text-indigo-600"
            [routerLinkActiveOptions]="{ exact: true }"
            class="relative py-7 text-sm font-semibold text-slate-600 transition-colors hover:text-indigo-600"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <!-- Boutons ordinateur -->
    <div class="hidden items-center gap-3 lg:flex">
      <a
        routerLink="/login"
        class="rounded-xl border border-indigo-100 px-5 py-2.5 text-sm font-semibold text-indigo-600 transition hover:border-indigo-200 hover:bg-indigo-50"
      >
        Se connecter
      </a>

      <a
        routerLink="/register"
        class="rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-200 transition hover:-translate-y-0.5 hover:shadow-xl"
      >
        Créer un compte
      </a>
    </div>

    <!-- Bouton du menu mobile -->
    <button
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Ouvrir ou fermer le menu"
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-indigo-50 text-indigo-600 lg:hidden"
    >
      @if (isMenuOpen) {
        <svg
          class="h-6 w-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18 18 6M6 6l12 12"
          />
        </svg>
      } @else {
        <svg
          class="h-6 w-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      }
    </button>
  </nav>

  <!-- Menu mobile -->
  @if (isMenuOpen) {
    <div class="border-t border-slate-100 bg-white px-5 py-5 lg:hidden">
      <ul class="space-y-2">
        @for (link of navLinks; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="bg-indigo-50 text-indigo-600"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="closeMenu()"
              class="block rounded-xl px-4 py-3 text-sm font-semibold text-slate-600 transition hover:bg-indigo-50 hover:text-indigo-600"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <div class="mt-5 grid gap-3">
        <a
          routerLink="/login"
          (click)="closeMenu()"
          class="rounded-xl border border-indigo-200 px-5 py-3 text-center text-sm font-semibold text-indigo-600"
        >
          Se connecter
        </a>

        <a
          routerLink="/register"
          (click)="closeMenu()"
          class="rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-5 py-3 text-center text-sm font-semibold text-white"
        >
          Créer un compte
        </a>
      </div>
    </div>
  }
</header>
