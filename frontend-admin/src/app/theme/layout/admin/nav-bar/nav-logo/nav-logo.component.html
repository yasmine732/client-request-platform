<div class="m-header">

  <!-- Logo ClientFlow -->
  <a
    [routerLink]="['/default/']"
    class="b-brand"
    style="
      display: flex;
      align-items: center;
      width: 190px;
      height: 80px;
      overflow: hidden;
      flex-shrink: 0;
    "
  >
    <img
      src="assets/images/clientflow-logo.png"
      alt="Logo ClientFlow"
      class="logo"
      style="
        width: 180px;
        height: 70px;
        object-fit: contain;
        object-position: left center;
        transform: scale(1.8);
        transform-origin: left center;
      "
    />
  </a>

  <!-- Bouton pour ouvrir et fermer le menu -->
  <div class="pc-h-item">
    <a
      href="javascript:void(0)"
      class="pc-head-link head-link-secondary m-0 mobile-menu"
      [ngClass]="{ on: navCollapsed() }"
      id="sidebar-hide mobile-collapse"
      (click)="navCollapse()"
      title="Ouvrir ou fermer le menu"
    >
      <i class="ti ti-menu-2"></i>
    </a>
  </div>

</div>
